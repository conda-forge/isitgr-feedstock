{% set name = "isitgr" %}
{% set version = "1.6.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/i/isitgr/isitgr-{{ version }}.tar.gz
  sha256: 87890cd59c7befa5d244dee6598ef6ceccd099210dd86547951cf87b682fe366

build:
  number: 0
  skip: True  # [py<310 or win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - {{ stdlib("c") }}
    - git
    - make
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  host:
    - python
    - pip
    - setuptools >=77
    - packaging >=24.2
    - wheel
  run:
    - python
    - numpy
    - six  # TODO: remove for next update
    - mock
    - setuptools  # for an import of pkg_resources
    - sympy >=1.0
    - scipy >=1.0
    - {{ compiler('fortran') }}  # [not win]

test:
  imports:
    - isitgr
  commands:
    - python -c "import isitgr; print(isitgr.__version__)"

about:
  home: https://github.com/mishakb/ISiTGR
  license: MIT AND GPL-3.0-or-later
  license_file: LICENCE.txt
  summary: Integrated Software in Testing General Relativity (ISiTGR). A patch of CAMB to add MG predictions.
  dev_url: https://github.com/mishakb/ISiTGR

extra:
  recipe-maintainers:
    - Lhior
    - gqcristhian
    - mishakb
